[project]
name = "pysnmp-mibs"
version = "2.13.0"
description = ""
authors = [{ name = "Ryan Faircloth", email = "actual@rfaircloth.com" }]
license = "BSD-2-Clause"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pyyaml!=6.0.0",
]

[dependency-groups]
# The build environment: what turns src/ into the published corpus. pysmi is
# here rather than in [project.dependencies] because a main dependency is
# present in every fork of the lock, including the consumer one below, and
# that is the coupling this split exists to remove.
#
# The floor named 5.0.0rc1 through the pysmi 5 cycle, because dependabot offers
# a prerelease only when the requirement string already names one, and this
# repository is what exercised that cycle -- core.db schema 2, the registry
# parsers, the arc index, the site emitter. pysmi 5.0.0 is on PyPI, so the
# floor is a final release and stays one: there is no rc stream left to track
# and nothing here resolves to a prerelease of pysmi.
#
# 5.3.1 is the floor rather than a preference, and two things put it there.
# The pull request preview builds with --publish-only and --patch-directory,
# which arrived in 5.1.0; a lower resolution does not degrade the preview, it
# refuses the command line, so this is a requirement in the literal sense. The
# workflow checks it anyway and says so in a sentence, because a lock is a
# claim about one machine and the error it replaces is a page of getopt usage.
# See .github/workflows/pr-mib-preview.yml.
#
# 5.3.1 raised it from 5.1.0. scripts/import_contribution.py commits what a
# contributor's mibcontribute scan produced, one file per module named for the
# module, which is what tests/source-layout-contract.py requires of src/.
# Before 5.3.1 a scan handed every module in a file the whole file, so a
# contribution cut from a vendor bundle of thirty modules arrived as thirty
# copies of the bundle. The importer would have committed them and the
# contract would have failed the build afterwards. See pysnmp/pysmi#320.
#
# 5.3.2 raised it from 5.3.1. That release promoted SNMP-SSH-TM-MIB (RFC 5592)
# out of pysmi's future/ and into the shipped bundle, so src/vendor/netsnmp no
# longer carries a copy. Filing an IETF module under the vendor who happened to
# redistribute it said something untrue about who publishes it, and the
# standard namespace this corpus resolves against is the bundle. On 5.3.1 the
# module would resolve nowhere and every module importing it would fail.
#
# 5.4.0 raised it from 5.3.2, and for the same reason one step larger. That
# release emptied pysmi's future/ tier: all 274 held modules moved into the
# shipped bundle, which now carries every one of the 485 its manifest names.
# The hold had rested on a survey showing nothing in this corpus imported one
# of them -- true, and the wrong question to ask of a general-purpose
# compiler, since observium ships 200 of the 274. docs/absent-modules.md fell
# from 194 modules to 31 because of it, and 1,402 index rows resolve again.
# See pysnmp/pysmi#323.
#
# 5.5.0 raised it from 5.4.0, because the CI step this floor exists to
# support cannot run without it. That release names the modules pysmi
# supplied an import for in report.json's `repaired` key -- a compile that
# succeeded on text which does not say what it means, which until then left
# no trace but a log line. "No module is repaired at build time" reads that
# key, and on 5.4.0 there is no key to read. See pysnmp/pysmi#324.
#
# 5.6.0 raised it from 5.5.0, and this one is about what the corpus carries
# rather than what the build can do. Auditing observium against this
# distribution left fourteen standard modules carried nowhere; thirteen are
# declined with a reason on docs/absent-modules.md and the fourteenth,
# IANA-IPPM-METRICS-REGISTRY-MIB (RFC 4148), went into the bundle. The
# standard namespace this corpus resolves against is the bundle, so on 5.5.0
# that module resolves nowhere and the site does not answer for its arcs.
# Nothing here imports it today, which is why this is a floor and not an
# urgent one. See pysnmp/pysmi#325.
#
# The `fast` extra is orjson, which pysmi takes for the corpus JSON when it is
# importable and falls back to the standard library when it is not. Worth
# about 4% of a build here -- SMI parsing is three quarters of a pass, so the
# encoder was never going to be the whole of it -- and worth taking because the
# bytes do not change: pysmi asserts its encoders agree with the standard
# library over every document this corpus produces, which is what keeps a
# build byte-reproducible whether or not the extra resolved. report.json names
# the implementation that ran.
dev = [
    "pre-commit>=4.6.2,<5",
    "pysnmp-pysmi[fast]>=5.6.0,<6",
]

# tests/runtime-compile-contract.py is a contract against pysnmp/pysnmp, which
# publishes as pysnmplib -- not against lextudio/pysnmp, which publishes as
# pysnmp and is what this pinned before. The two are different distributions
# from different repositories, so the old pin meant no release of pysnmp/pysnmp
# could ever be observed here. See #381. The floor names an rc on purpose, for
# the reason pysnmp's own pyproject.toml gives: dependabot offers a prerelease
# only when the requirement string already names one, so this tracks the rc
# stream this repository is released alongside.
#
# In a group of its own, and declared to conflict with the build environment,
# because the two want different pysmi versions and both are right to. The
# corpus is built with the pysmi this repository pins; the contract runs the
# corpus the way a consumer does, against the pysmi pysnmp itself depends on.
# Holding them in one environment made pysnmp's ceiling our floor, so a pysmi
# release could not be adopted here until pysnmp had adopted it too -- a
# coupling that does not exist in fact, since nothing pysnmp ships reads this
# repository at build time.
consumer = [
    "pysnmplib>=6.0.0rc10,<7",
]

[tool.uv]
package = false

# The consumer floor names an rc, so every resolve has to be willing to take
# one. Without this, a bare `uv run` re-resolves away from the locked
# prerelease and the contract runs against a different pysnmp than the
# lockfile records. The build environment no longer needs it -- pysmi's floor
# is a final release -- but the setting is per-resolution, not per-group.
prerelease = "allow"

# uv resolves a conflicting pair into separate forks of the lock rather than
# failing, which is what lets one lockfile hold both a build environment on
# pysmi 5 and a consumer environment on whatever pysnmp pins.
conflicts = [[{ group = "dev" }, { group = "consumer" }]]

# The tooling pyasn1, pysmi and pysnmp share, so a contributor moving between
# the four repositories meets the same lint and the same formatter. This
# repository ran black, isort and flake8 instead, which is three tools to
# ruff's one and a different set of answers about the same code.
#
# D1 is deliberately not selected. The siblings are libraries whose public
# surface is documented; the Python here is five build and contract scripts
# whose module docstrings carry the reasoning and whose functions are local
# helpers.
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "S",      # flake8-bandit (security)
    "SIM",    # flake8-simplify
    "BLE",    # flake8-blind-except
    "G",      # flake8-logging-format (keep logging interpolation lazy)
    "LOG",    # flake8-logging (logger misuse)
    "FLY",    # flynt (static str.join -> f-string)
    "C4",     # flake8-comprehensions
    "RSE",    # flake8-raise
    "RUF",    # ruff-specific rules
    "PL",     # pylint
    "TRY",    # tryceratops
]
ignore = [
    # Shared with pyasn1, pysmi and pysnmp.
    "E501",     # line-too-long -- ruff format decides where lines break
    "E721",     # type-comparison
    "E731",     # lambda-assignment
    "E741",     # ambiguous-variable-name -- SMI/ASN.1 naming conventions
    "E712",     # true-false-comparison
    "E402",     # module-import-not-at-top
    "B011",     # assert-false -- used in tests
    "B007",     # unused-loop-control-variable
    "B905",     # zip-without-explicit-strict
    "B028",     # no-explicit-stacklevel
    "SIM108",   # if-else-block-instead-of-if-exp -- readability preference
    "SIM102",   # collapsible-if -- readability preference
    "SIM105",   # suppressible-exception
    "SIM101",   # duplicate-isinstance-call
    "SIM110",   # reimplemented-builtin
    "PLR0911",  # too-many-return-statements
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR0915",  # too-many-statements
    "PLR0917",  # too-many-positional-arguments
    "PLR2004",  # magic-value-comparison -- SMI and ASN.1 constants
    "PLC0415",  # import-outside-top-level
    "PLW2901",  # redefined-loop-name
    "PLW0603",  # global-statement
    "RUF005",   # collection-literal-concatenation -- style preference
    "RUF012",   # mutable-class-default
    "RUF021",   # parenthesize-chained-operators
    "RUF059",   # unused-unpacked-variable -- matches B007 above
    "TRY003",   # raise-vanilla-args -- message text is part of the contract

    # Specific to what this repository is: build scripts that shell out to a
    # MIB compiler and read MIBs from paths a manifest supplies.
    "S603",     # subprocess-without-shell-equals-true
    "S607",     # start-process-with-partial-path
]

[tool.ruff.lint.per-file-ignores]
# The contract scripts exit non-zero on failure rather than raising, and they
# are run as programs, not imported.
"tests/*" = ["T201"]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
# pysmi's lexer is imported by scripts/mib_sources.py to read MIB text.
# The pre-commit mypy hook runs in its own environment, where the project's
# dependencies are not installed, so the import is unresolvable there even
# though it resolves fine at runtime.
module = ["pysmi.*"]
ignore_missing_imports = true
