[project]
name = "pysnmp-mibs"
version = "2.1.0"
description = ""
authors = [{ name = "rfaircloth-splunk", email = "rfaircloth@splunk.com" }]
license = "BSD-2-Clause"
requires-python = ">=3.10,<3.12"
dependencies = [
    "pyyaml!=6.0.0",
]

[dependency-groups]
# The build environment: what turns src/ into the published corpus. pysmi is
# here rather than in [project.dependencies] because a main dependency is
# present in every fork of the lock, including the consumer one below, and
# that is the coupling this split exists to remove.
dev = [
    "pre-commit>=4.6.2,<5",
    "pysnmp-pysmi>=4.0.0rc4,<5",
]

# tests/runtime-compile-contract.py is a contract against pysnmp/pysnmp, which
# publishes as pysnmplib -- not against lextudio/pysnmp, which publishes as
# pysnmp and is what this pinned before. The two are different distributions
# from different repositories, so the old pin meant no release of pysnmp/pysnmp
# could ever be observed here. See #381. The floor names an rc on purpose, for
# the reason pysnmp's own pyproject.toml gives: dependabot offers a prerelease
# only when the requirement string already names one, so this tracks the rc
# stream this repository is released alongside.
#
# In a group of its own, and declared to conflict with the build environment,
# because the two want different pysmi versions and both are right to. The
# corpus is built with the pysmi this repository pins; the contract runs the
# corpus the way a consumer does, against the pysmi pysnmp itself depends on.
# Holding them in one environment made pysnmp's ceiling our floor, so a pysmi
# release could not be adopted here until pysnmp had adopted it too -- a
# coupling that does not exist in fact, since nothing pysnmp ships reads this
# repository at build time.
consumer = [
    "pysnmplib>=6.0.0rc10,<7",
]

[tool.uv]
package = false

# uv resolves a conflicting pair into separate forks of the lock rather than
# failing, which is what lets one lockfile hold both a build environment on
# pysmi 4 and a consumer environment on whatever pysnmp pins.
conflicts = [[{ group = "dev" }, { group = "consumer" }]]

# The tooling pyasn1, pysmi and pysnmp share, so a contributor moving between
# the four repositories meets the same lint and the same formatter. This
# repository ran black, isort and flake8 instead, which is three tools to
# ruff's one and a different set of answers about the same code.
#
# D1 is deliberately not selected. The siblings are libraries whose public
# surface is documented; the Python here is five build and contract scripts
# whose module docstrings carry the reasoning and whose functions are local
# helpers.
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "S",      # flake8-bandit (security)
    "SIM",    # flake8-simplify
    "BLE",    # flake8-blind-except
    "G",      # flake8-logging-format (keep logging interpolation lazy)
    "LOG",    # flake8-logging (logger misuse)
    "FLY",    # flynt (static str.join -> f-string)
    "C4",     # flake8-comprehensions
    "RSE",    # flake8-raise
    "RUF",    # ruff-specific rules
    "PL",     # pylint
    "TRY",    # tryceratops
]
ignore = [
    # Shared with pyasn1, pysmi and pysnmp.
    "E501",     # line-too-long -- ruff format decides where lines break
    "E721",     # type-comparison
    "E731",     # lambda-assignment
    "E741",     # ambiguous-variable-name -- SMI/ASN.1 naming conventions
    "E712",     # true-false-comparison
    "E402",     # module-import-not-at-top
    "B011",     # assert-false -- used in tests
    "B007",     # unused-loop-control-variable
    "B905",     # zip-without-explicit-strict
    "B028",     # no-explicit-stacklevel
    "SIM108",   # if-else-block-instead-of-if-exp -- readability preference
    "SIM102",   # collapsible-if -- readability preference
    "SIM105",   # suppressible-exception
    "SIM101",   # duplicate-isinstance-call
    "SIM110",   # reimplemented-builtin
    "PLR0911",  # too-many-return-statements
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR0915",  # too-many-statements
    "PLR0917",  # too-many-positional-arguments
    "PLR2004",  # magic-value-comparison -- SMI and ASN.1 constants
    "PLC0415",  # import-outside-top-level
    "PLW2901",  # redefined-loop-name
    "PLW0603",  # global-statement
    "RUF005",   # collection-literal-concatenation -- style preference
    "RUF012",   # mutable-class-default
    "RUF021",   # parenthesize-chained-operators
    "RUF059",   # unused-unpacked-variable -- matches B007 above
    "TRY003",   # raise-vanilla-args -- message text is part of the contract

    # Specific to what this repository is: build scripts that shell out to a
    # MIB compiler and read MIBs from paths a manifest supplies.
    "S603",     # subprocess-without-shell-equals-true
    "S607",     # start-process-with-partial-path
]

[tool.ruff.lint.per-file-ignores]
# The contract scripts exit non-zero on failure rather than raising, and they
# are run as programs, not imported.
"tests/*" = ["T201"]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
# pysmi's lexer is imported by scripts/mib_sources.py to read MIB text.
# The pre-commit mypy hook runs in its own environment, where the project's
# dependencies are not installed, so the import is unresolvable there even
# though it resolves fine at runtime.
module = ["pysmi.*"]
ignore_missing_imports = true
