[project]
name = "pysnmp-mibs"
version = "1.22.0"
description = ""
authors = [{ name = "rfaircloth-splunk", email = "rfaircloth@splunk.com" }]
license = "BSD-2-Clause"
requires-python = ">=3.10,<3.12"
dependencies = [
    "pysnmp-pysmi>=3.0.0rc4,<4",
    "pyyaml!=6.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2,<5",
    "pysnmp>=7,<8",
]

[tool.uv]
package = false

[tool.isort]
# black and isort disagree about how to wrap a long import unless isort is
# told to defer to it. Without this the two pre-commit hooks rewrite the
# same lines back and forth.
profile = "black"

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
# pysmi's lexer is imported by scripts/mib_sources.py to read MIB text.
# The pre-commit mypy hook runs in its own environment, where the project's
# dependencies are not installed, so the import is unresolvable there even
# though it resolves fine at runtime.
module = ["pysmi.*"]
ignore_missing_imports = true
