$head<script>
// Carry the theme the reader chose in the documentation. Furo writes it to
// localStorage under "theme". The documentation is copied into this tree and
// served from the same origin, so the value is readable here. Presentation
// only: every fact this page states is in the markup, and a crawler that runs
// no script still reads all of it.
(function () {
  try {
    var chosen = localStorage.getItem("theme");
    if (chosen === "light" || chosen === "dark") {
      document.documentElement.dataset.theme = chosen;
    }
  } catch (e) {}
})();
</script>
</head>
