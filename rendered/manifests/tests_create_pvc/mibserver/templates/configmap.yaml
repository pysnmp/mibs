---
# Source: mibserver/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: default-mibserver
  labels:
    helm.sh/chart: mibserver-CURRENT-VERSION
    app.kubernetes.io/name: mibserver
    app.kubernetes.io/instance: default
    app.kubernetes.io/version: "CURRENT-VERSION"
    app.kubernetes.io/managed-by: Helm
data:
  nginx.conf: |
    worker_processes  auto;

    error_log  /var/log/nginx/error.log notice;
    pid        /tmp/nginx.pid;

    events {
        worker_connections  1024;
    }

    http {
        proxy_temp_path /tmp/proxy_temp;
        client_body_temp_path /tmp/client_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/log/nginx/access.log  main;

        sendfile        on;
        tcp_nopush     on;

        keepalive_timeout  65;

        gzip  on;
        # nginx compresses text/html and nothing else by default, and none of
        # what this serves is text/html: .csv has no mime mapping at all so it
        # falls to the default type, asn1/ modules are extensionless, and the
        # compiled trees are json. Measured: index.csv left the server as 4.6 MB
        # uncompressed. Every consumer fetches it at start-up.
        gzip_types text/plain application/json application/octet-stream;
        gzip_min_length 1024;
        # Vary: Accept-Encoding on anything compressed. Without it a cache in
        # front of this can hand a gzipped body to a client that never asked
        # for one.
        gzip_vary on;

        server {
            listen       8000;
            root /usr/share/nginx/html;

            # The merged OID index, when there is one. A user's MIBs are
            # indexed at start-up into the overlay together with the published
            # rows, so this file answers for both trees; without local MIBs the
            # overlay is empty and the corpus's own index is served.
            location = /index.csv {
                root /usr/share/nginx/overlay;
                try_files /index.csv @corpus;
            }

            # Everything else: the corpus first, then whatever was compiled at
            # start-up. That order is what keeps a user's copy of a module from
            # silently replacing the published one -- the corpus is what this
            # deployment promises, and the overlay adds to it.
            location / {
                expires 10m;
                try_files $uri @overlay;
            }

            location @overlay {
                root /usr/share/nginx/overlay;
                expires 10m;
            }

            location @corpus {
                root /usr/share/nginx/html;
                expires 10m;
            }
        }

        server {
            listen       8080;
            root /dev/null;
            location / {
                stub_status;
            }
        }
    }
