# Default values for mibserver.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
# Enable IPv6 listeners for the MIB and status endpoints while retaining IPv4.
ipv6Enabled: false

# The serving container: nginx from upstream, unmodified. This project no
# longer publishes an image derived from it, so the tag is pinned here rather
# than defaulting to the chart's appVersion -- appVersion describes the corpus,
# and says nothing about which nginx is current.
image:
  repository: nginxinc/nginx-unprivileged
  pullPolicy: IfNotPresent
  tag: "1.29.1-bookworm"

# The corpus, mounted read-only as an OCI image volume. Requires Kubernetes
# 1.33 or newer and a container runtime that implements image volumes
# (containerd 2.0+, CRI-O 1.31+); the chart's kubeVersion enforces the first
# half of that.
corpus:
  repository: ghcr.io/pysnmp/mibs/corpus
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# pysmi, run as an init container to compile user-supplied MIBs. Pulled only
# when localMibs is configured; a deployment serving the published corpus alone
# never fetches it.
tools:
  repository: ghcr.io/pysnmp/mibs/tools
  pullPolicy: IfNotPresent
  tag: ""
  resources:
    limits:
      cpu: "2"
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: False
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

localMibs:
  # pathToMibs is the path on the node where mibserver pod will be scheduled to
  # inside the directory you can put all the MIB files you want to add to the mibserver
  # if you're installing mibserver on a multi-node cluster, use persistence.existingClaim instead
  pathToMibs: ""
  persistence:
    # use existingClaim when installing mibserver on a multi-node cluster
    # provide an existing PersistentVolumeClaim (works only when pathToMibs is empty)
    # copy mib files to one of the node and use nodeSelector to schedule the mibserver to that specific node
    existingClaim: ""
    storageClass: "microk8s-hostpath"
    size: 1Gi

test:
  image:
    repository: busybox
    tag: "1.37.0"
    pullPolicy: Always