{{- $localMibs := include "mibserver.localMibs" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mibserver.fullname" . }}
  labels:
    {{- include "mibserver.labels" . | nindent 4 }}
  annotations:
    "kube-score/ignore": "container-image-pull-policy"
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mibserver.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # The config is mounted by subPath, which does not update in place, so
        # a changed nginx.conf has to roll the pods to take effect.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mibserver.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mibserver.serviceAccountName" . }}
      securityContext:
        fsGroup: 10001
      {{- if $localMibs }}
      initContainers:
        # The only thing in this deployment that runs code of ours, and the
        # only thing that has to: a user's MIB sources arrive as files and
        # something has to compile them before they can be served or indexed.
        #
        # It is the same driver CI builds the published corpus with, so a
        # user's MIBs are resolved against the published tree by the same
        # rules as everything already in it -- and it writes into an emptyDir,
        # so the serving container's root filesystem stays read-only.
        - name: compile-local-mibs
          image: "{{ .Values.tools.repository }}:{{ .Values.tools.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.tools.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          command:
            - /bin/sh
            - -c
            # The merge keeps every published row and adds a local one only
            # for an OID the corpus does not already answer -- the same rule
            # the overlay follows for the modules themselves. A union of whole
            # rows, which is what this deployment used to do, leaves two rows
            # for an OID both define, and a consumer parsing into a map takes
            # whichever it reads last.
            - |
              set -eu
              mibcorpus --quiet \
                --resolve-namespace=standard:corpus:{{ include "mibserver.corpusRoot" . }}/asn1 \
                --namespace=vendor:local:/local-mibs \
                --output-directory={{ include "mibserver.overlayRoot" . }} \
                --emit=asn1 --emit=json --emit=index-v2 --emit=report
              awk -F, 'NR==FNR { published[$2]; print; next } !($2 in published)' \
                {{ include "mibserver.corpusRoot" . }}/index.csv \
                {{ include "mibserver.overlayRoot" . }}/index-v2.csv \
                >{{ include "mibserver.overlayRoot" . }}/index.csv
          resources:
            {{- toYaml .Values.tools.resources | nindent 12 }}
          volumeMounts:
            - mountPath: {{ include "mibserver.corpusRoot" . }}
              name: corpus
              readOnly: true
            - mountPath: {{ include "mibserver.overlayRoot" . }}
              name: overlay
            - mountPath: /local-mibs
              name: task-pv-storage
              readOnly: true
            - mountPath: /tmp
              name: tmp
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # Always. Nothing writes to the root filesystem any more: the
            # config is a ConfigMap, the corpus is a read-only image volume,
            # and anything compiled at start-up went into the overlay before
            # this container started.
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          # The default repeats values.yaml's pin, for an upgrade carrying a
          # values file from before this chart stopped defaulting the tag to
          # appVersion: an empty tag there would otherwise render "nginx:".
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default "1.29.1-bookworm" }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Straight to nginx, past the base image's entrypoint scripts: the
          # config is complete as rendered and there is nothing to template or
          # substitute at start-up.
          command:
            - nginx
            - -g
            - daemon off;
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: http-status
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http-status
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /etc/nginx/nginx.conf
              name: config
              subPath: nginx.conf
              readOnly: true
            - mountPath: {{ include "mibserver.corpusRoot" . }}
              name: corpus
              readOnly: true
            - mountPath: {{ include "mibserver.overlayRoot" . }}
              name: overlay
              readOnly: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq (include "mibserver.podAntiAffinity" .) "hard" }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: "kubernetes.io/hostname"
              labelSelector:
                matchLabels:
                    {{- include "mibserver.selectorLabels" . | nindent 22 }}
      {{- else if eq (include "mibserver.podAntiAffinity" .) "soft" }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "mibserver.selectorLabels" . | nindent 22 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "mibserver.fullname" . }}
        # The corpus, as an OCI image mounted read-only. Kubernetes 1.33 or
        # newer, and a runtime that implements image volumes -- see the chart's
        # kubeVersion. This is what replaced baking the corpus into an nginx
        # image of our own: the bytes are the same, they arrive as a volume,
        # and the image serving them is upstream's.
        - name: corpus
          image:
            reference: "{{ .Values.corpus.repository }}:{{ .Values.corpus.tag | default .Chart.AppVersion }}"
            pullPolicy: {{ .Values.corpus.pullPolicy }}
        - name: overlay
          emptyDir: {}
      {{- if $localMibs }}
        - name: task-pv-storage
          persistentVolumeClaim:
          {{- with include "mibserver.existingClaim" . }}
            claimName: {{ . | quote }}
        {{ else }}
            claimName: {{ include "mibserver.fullname" . }}
        {{- end }}
        {{- end }}
