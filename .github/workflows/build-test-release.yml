# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches:
      - "main"
      # .releaserc has cut alpha prereleases from next since it was written,
      # but nothing here ever ran on it. The branch ruleset requires ci-gate on
      # next, and a required check on a branch CI ignores never reports at all.
      - "next"
      - "develop"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches: [main, next, develop]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: pre-commit/action@v3.0.1

  build:
    name: Build Release
    needs:
      - pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pages: write
    concurrency:
      # Only main deploys to gh-pages, so only main needs the shared lock.
      # develop/tag/PR runs get their own group or they evict main while it is
      # queued (GitHub keeps at most one pending run per group).
      group: ${{ github.ref == 'refs/heads/main' && 'gh-pages' || format('ci-{0}', github.ref) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          #Very Important semantic-release won't trigger a tagged
          #build if this is not set false
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.9"
          python-version: "3.11"
          enable-cache: true
      - name: Cache pysnmp
        id: cache-pysnmp
        uses: actions/cache@v6
        with:
          path: .pycache/
          key: ${{ runner.os }}-pysnmp
      - run: uv sync --frozen
      #Build and index
      - run: mkdir -p output/asn1
      - run: make index
        env:
          MIBDUMP: ${{ github.workspace }}/.venv/bin/mibdump
      - uses: actions/upload-artifact@v7
        with:
          path: log/
      - name: Carry forward legacy chart index
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p output/charts
          cp charts/index.yaml output/charts/index.yaml
          grep -q 'releases/download' output/charts/index.yaml
      - name: Deploy - GH-PAGES
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          force_orphan: true
      #Build docker images
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:qemu-v9.2.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: mibserver:smoke
      - name: Report image size
        run: docker image ls mibserver:smoke
      - name: Smoke test image
        run: ./tests/smoke-test.sh mibserver:smoke
      - name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/pysnmp/mibs/container
          tags: |
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=sha,format=long
      - name: Build and push action
        id: docker_action_build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-to: type=inline
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6.0.0
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/git
            @google/semantic-release-replace-plugin@1.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.SEMREL_TOKEN }} #
  update-semver:
    name: Move Respository semver tags
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: haya14busa/action-update-semver@v1

  # One check name for the branch ruleset to require, standing in for every
  # gating job above. Named the same in all four pysnmp repositories so that one
  # ruleset definition fits them all, and so that adding lint, docs or test jobs
  # here later needs no change to the ruleset. See .github/rulesets/README.md.
  ci-gate:
    name: ci-gate
    # always(), or a failure anywhere upstream skips this job too, and a
    # skipped required check never reports: the pull request would just hang.
    if: always()
    needs:
      - pre-commit
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every gating job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          results = {name: job["result"] for name, job in json.loads(os.environ["NEEDS"]).items()}
          for name, result in sorted(results.items()):
              print(f"{name}: {result}")
              # Skipped counts as a failure: a job that never ran has not
              # passed, and a job whose dependency failed is skipped, not red.
              if result != "success":
                  print(f"::error::{name} did not succeed ({result})")
          sys.exit(0 if all(r == "success" for r in results.values()) else 1)
          PY
