# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches:
      - "main"
      - "develop"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches: [main, develop]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: pre-commit/action@v3.0.1

  mib-sources:
    name: MIB source manifest
    permissions:
      # Reads the tree and nothing else. The workflow as a whole has no
      # permissions block, so without this the job would inherit the
      # repository default, which includes write.
      contents: read
    # Offline half of the freshness tooling: does mib-sources.json still
    # describe the tree it is checked in against? The half that talks to
    # vendors runs on a schedule instead, in mib-freshness.yml, so a
    # contributor's pull request cannot go red over somebody's outage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.9"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen
      - name: Test the provenance tooling
        # Offline and quick. Covers the two judgements that were wrong
        # once and looked right: per-line attribution, and confirming
        # drift on the publisher's bytes rather than on the verdict.
        run: uv run python tests/test_mib_sources.py
      - run: uv run python scripts/update_vendor_mibs.py --validate

  chart:
    name: Chart contract
    permissions:
      # Reads the tree and nothing else, like mib-sources above.
      contents: read
    # Renders charts/mibserver and checks it against rendered/, which is
    # committed as evidence of what the chart produces and which nothing
    # regenerated until now -- so a template edit could leave those files
    # describing a chart that no longer exists. Also asserts that a writable
    # root follows from either local-MIB input, the property #208 was about.
    #
    # Its own job rather than a step in build: it needs helm and a checkout
    # and nothing else, so it answers in seconds instead of behind a corpus
    # build. See pysnmp/mibs#372.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Helm
        uses: azure/setup-helm@v5
      - run: ./tests/chart-contract.sh

  # What used to be one "Build Release" job is four: three independent builds
  # and the release that needs all of them. The old job ran two full driver
  # invocations back to back and then an emulated pip install that had waited
  # behind both, for no reason other than that they shared a checkout. Run
  # side by side, the release starts when the slowest of the three finishes
  # instead of when their sum does.
  #
  # pre-commit and chart gate all three, for the reason the single job gave:
  # on main these deploy gh-pages, push images and lead to semantic release,
  # so a failed chart contract that let them publish anyway would make the
  # check advisory rather than a gate (pysnmp/mibs#372).
  corpus:
    name: Published corpus
    needs:
      - pre-commit
      - chart
    runs-on: ubuntu-latest
    permissions:
      # contents: write for the gh-pages push, packages: write for ghcr.
      contents: write
      packages: write
      pages: write
    concurrency:
      # Only main deploys to gh-pages, so only main needs the shared lock.
      # develop/tag/PR runs get their own group or they evict main while it is
      # queued (GitHub keeps at most one pending run per group).
      #
      # This job alone carries it. A group shared with the sibling builds would
      # queue them behind this one and undo the split; gh-pages is the only
      # thing here two runs can race over, and it is deployed from here.
      group: ${{ github.ref == 'refs/heads/main' && 'gh-pages' || format('ci-{0}', github.ref) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.9"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen
      # One driver invocation. The compact corpus is a second one, in a job of
      # its own; both come from the same source set and differ only in whether
      # the standard namespace is published. See corpus.json and
      # corpus-compact.json.
      - name: Build the published corpus
        run: make corpus
      # Runs after the build so it checks the produced index.csv and
      # index-v2.csv as well as the checked-in frozen snapshot. Gates before
      # the image build, which is the expensive part.
      - name: OID index contract
        run: ./tests/index-contract.sh
      - name: Published artifact contract
        run: ./tests/artifact-contract.sh
      # In the consumer group's environment, not the build one. The two hold
      # different pysmi versions on purpose: the corpus above was built with
      # the pysmi this repository pins, and this checks it against the pysmi
      # pysnmp itself depends on, which is the one a consumer actually has.
      - name: Runtime-compile contract
        run: |
          uv sync --frozen --only-group consumer
          uv run --no-sync python ./tests/runtime-compile-contract.py
          uv sync --frozen
      - name: Corpus build report
        run: cat output/report.json
      # One archive per format, for anyone who wants the corpus without
      # fetching 5510 files over HTTP or pulling an image -- an air-gapped
      # install, or a build that vendors it. Named after the tree they hold so
      # a release page says what each one is. semantic-release attaches them to
      # the release it creates; the compact archive is built beside the compact
      # corpus and meets these again in the release job.
      #
      # Deliberately not gated on a publishing ref. A step that only ever runs
      # at release time is a step nothing has proved, which is how the image
      # push gate in this same workflow came to be wrong; a pull request builds
      # the archives and throws them away, and that is what keeps the release
      # path honest. semantic-release attaches them only where it runs anyway.
      - name: Archive the corpus for the release
        run: |
          set -eu
          mkdir -p dist
          # -X drops the extra-attributes fields whose contents vary between
          # runs, so an unchanged tree archives to unchanged bytes.
          (cd output && zip -qrX ../dist/mibs-asn1.zip asn1)
          (cd output && zip -qrX ../dist/mibs-json.zip json)
          (cd output && zip -qrX ../dist/mibs-index.zip \
            index.csv index-v2.csv standard.txt)
          ls -l dist
      # The release runs in a container of its own now, so the archives have to
      # travel to it. The name matches the pattern that job globs for; nothing
      # else downloads them, and a day is longer than they are wanted for.
      # compression-level 0 because these are already zips.
      - uses: actions/upload-artifact@v7
        with:
          name: release-archives-corpus
          path: dist
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: corpus-report
          path: output/report.json
      - name: Carry forward legacy chart index
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p output/charts
          cp charts/index.yaml output/charts/index.yaml
          grep -q 'releases/download' output/charts/index.yaml
      - name: Deploy - GH-PAGES
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          force_orphan: true
      #Build docker images
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:qemu-v9.2.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # The serving path, over real nginx and the config the chart renders.
      # There is no image of ours on that path to smoke-test any more; what is
      # ours is the nginx.conf, so that is what runs here. Needs helm for the
      # render.
      - name: Set up Helm
        uses: azure/setup-helm@v5
      # Extracted rather than served from output/ directly: the image states
      # its own file modes, and those are what a pod mounts. A corpus that
      # serves fine on the runner and 403s from the image is exactly the
      # failure this catches.
      - name: Extract the corpus image
        run: |
          mkdir -m 0755 -p /tmp/corpus-image
          docker buildx build -f docker/corpus.Dockerfile \
            --build-arg CORPUS=output \
            -o type=local,dest=/tmp/corpus-image .
      - name: Serving contract
        run: ./tests/serving-contract.sh /tmp/corpus-image
      # Only a ref that publishes needs credentials. A pull request builds the
      # images to prove the Dockerfiles still work and pushes nothing.
      #
      # The tag ref matters as much as main: semantic-release tags the commit
      # main just built, that tag starts a second run, and only in that run
      # does docker/metadata-action have a version to derive the semver tags
      # from. The chart's appVersion names those tags, so a gate that excluded
      # the tag run would leave every release pointing at images nothing had
      # pushed.
      - name: Login to GitHub Packages Docker Registry
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/pysnmp/mibs/corpus
          tags: |
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=sha,format=long
      # FROM scratch and a COPY, so there is nothing architecture-specific in
      # it -- but it is mounted into pods on both, and a manifest naming both
      # is what lets one tag serve them.
      #
      # No cache-to. This build wrote an inline cache that nothing ever read:
      # inline cache is only reachable through a cache-from naming the pushed
      # image, and no build in this workflow set one. The tools image is the
      # one build whose layer is worth keeping, and it says so there.
      - name: Build and push the corpus image
        id: docker_action_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/corpus.Dockerfile
          build-args: |
            CORPUS=output
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}

  # The same corpus without the modules a runtime that has pysmi already holds.
  # Not served over HTTP and not in the mibserver chart: it is for mounting,
  # and it is published as an image for exactly that.
  #
  # Its own job because it is its own driver invocation over the same sources.
  # Nothing it produces is read by the published corpus and nothing the
  # published corpus produces is read by it, so the only thing sequencing them
  # bought was a longer wall clock.
  corpus-compact:
    name: Compact corpus
    needs:
      - pre-commit
      - chart
    runs-on: ubuntu-latest
    permissions:
      # Reads the tree; writes only to the package registry.
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.9"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen
      - name: Build the compact corpus
        run: make corpus-compact
      - name: Compact corpus build report
        run: cat output-compact/report.json
      # Ungated for the reason the published archives are; see that step.
      - name: Archive the compact corpus for the release
        run: |
          set -eu
          mkdir -p dist
          (cd output-compact && zip -qrX ../dist/mibs-compact.zip asn1 index-v2.csv)
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-archives-compact
          path: dist
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: corpus-compact-report
          path: output-compact/report.json
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:qemu-v9.2.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Packages Docker Registry
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta (compact corpus)
        id: docker_meta_compact
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/pysnmp/mibs/corpus-compact
          tags: |
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=sha,format=long
      - name: Build and push the compact corpus image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/corpus.Dockerfile
          build-args: |
            CORPUS=output-compact
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker_meta_compact.outputs.tags }}
          labels: ${{ steps.docker_meta_compact.outputs.labels }}

  corpus-db:
    name: Corpus database
    needs:
      - pre-commit
      - chart
    runs-on: ubuntu-latest
    permissions:
      # Reads the tree; writes only to the package registry.
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.9"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen
      # A third projection of the same sources, in a job of its own for the
      # reason the compact corpus has one: it is a second full pass over 5510
      # modules and there is no result to share between them.
      - name: Build the corpus database
        run: make corpus-db
      # Before the archive, so a database that would not answer never becomes a
      # release asset. Python rather than shell because sqlite3 the module
      # ships wherever this build runs and sqlite3 the command-line tool is a
      # separate package.
      - name: Corpus database contract
        run: uv run python ./tests/corpus-db-contract.py
      - name: Corpus database build report
        run: cat output-db/report.json
      # Ungated for the reason the other archives are; see that step in the
      # published-corpus job.
      - name: Archive the corpus database for the release
        run: |
          set -eu
          mkdir -p dist
          (cd output-db && zip -qrX ../dist/mibs-core-db.zip core.db)
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-archives-core-db
          path: dist
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: corpus-db-report
          path: output-db/report.json
      # The same scratch image the two corpus trees get, holding one file. A
      # pysnmp runtime does not serve core.db over HTTP, it opens it -- and
      # Kubernetes 1.33 mounts an OCI image as a read-only volume, which is
      # exactly the immutable=1 file the reader wants and the migration path
      # off index.csv for a deployment that already mounts a corpus image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:qemu-v9.2.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Packages Docker Registry
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta (corpus database)
        id: docker_meta_db
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/pysnmp/mibs/corpus-db
          tags: |
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=sha,format=long
      - name: Build and push the corpus database image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/corpus.Dockerfile
          build-args: |
            CORPUS=output-db
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker_meta_db.outputs.tags }}
          labels: ${{ steps.docker_meta_db.outputs.labels }}

  # pysmi on an upstream Python base, for the chart's local-MIB init container.
  # The only image this project publishes that runs anything, and the only one
  # that needs no corpus to build -- which is why it used to be the last thing
  # in a job that had spent twenty minutes building two.
  tools:
    name: Tools image
    needs:
      - pre-commit
      - chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:qemu-v9.2.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Packages Docker Registry
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta (tools)
        id: docker_meta_tools
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/pysnmp/mibs/tools
          tags: |
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=sha,format=long
      - name: Build and push the tools image
        uses: docker/build-push-action@v7
        with:
          # docker/, not the repository root. This Dockerfile copies nothing,
          # but a root context hands the builder whatever .dockerignore lets
          # through -- which here is output/ and output-compact/, near a
          # gigabyte of corpus streamed into a build that does not read a byte
          # of it. The two Dockerfiles are the whole of what it needs.
          context: docker
          file: docker/tools.Dockerfile
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker_meta_tools.outputs.tags }}
          labels: ${{ steps.docker_meta_tools.outputs.labels }}
          # The whole of this image is one pip install, run twice: once native
          # and once for arm64 under emulation, which is where its minutes go.
          # Nothing in that layer comes from this repository -- it is the base
          # image digest and PYSMI_VERSION -- so a run that changes neither can
          # restore it whole instead of re-resolving and re-installing pysmi
          # under qemu.
          #
          # Deliberately not extended to the corpus images. Those are FROM
          # scratch with one COPY of a tree that `make corpus` rewrites on
          # every run, so their only layer misses by construction; caching it
          # would push hundreds of megabytes into the repository's 10 GB cache
          # each build to buy a hit that cannot happen.
          cache-from: type=gha,scope=tools
          cache-to: type=gha,mode=max,scope=tools

  release:
    name: Release
    # Everything a release names has to exist before it names it. The chart's
    # appVersion points at the images, and the assets are the archives, so a
    # release that ran beside the builds could tag a commit whose images had
    # not been pushed and whose archives did not exist. The single job kept
    # that order by putting these steps last; this keeps it with needs.
    needs:
      - corpus
      - corpus-compact
      - corpus-db
      - tools
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          #Very Important semantic-release won't trigger a tagged
          #build if this is not set false
          persist-credentials: false
      # dist/ was built two jobs ago, in two of them. merge-multiple puts both
      # uploads back into one directory, which is the shape .releaserc names
      # its assets in.
      - name: Collect the release archives
        uses: actions/download-artifact@v7
        with:
          pattern: release-archives-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6.0.0
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/git
            @google/semantic-release-replace-plugin@1.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.SEMREL_TOKEN }} #
  update-semver:
    name: Move Respository semver tags
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: haya14busa/action-update-semver@v1
