# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches:
      - "main"
      - "develop"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches: [main, develop]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: pre-commit/action@v3.0.1

  build:
    name: Build Release
    needs:
      - pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pages: write
    concurrency:
      # Only main deploys to gh-pages, so only main needs the shared lock.
      # develop/tag/PR runs get their own group or they evict main while it is
      # queued (GitHub keeps at most one pending run per group).
      group: ${{ github.ref == 'refs/heads/main' && 'gh-pages' || format('ci-{0}', github.ref) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          #Very Important semantic-release won't trigger a tagged
          #build if this is not set false
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: x64
      - name: Install poetry
        run: pipx install --python python3.11 poetry
      - name: Cache pysnmp
        id: cache-pysnmp
        uses: actions/cache@v6
        with:
          path: .pycache/
          key: ${{ runner.os }}-pysnmp
      - run: poetry install
      #Build and index
      - run: mkdir -p output/asn1
      - run: poetry run make index
      - uses: actions/upload-artifact@v7
        with:
          path: log/
      - name: Carry forward legacy chart index
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output/charts
          gh release download helm-legacy --pattern index.yaml --dir output/charts
          test -s output/charts/index.yaml
          grep -q 'releases/download' output/charts/index.yaml
      - name: Deploy - GH-PAGES
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          force_orphan: true
      #Build docker images
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:qemu-v9.2.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/pysnmp/mibs/container
          tags: |
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=sha,format=long
      - name: Build and push action
        id: docker_action_build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-to: type=inline
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6.0.0
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/git
            @google/semantic-release-replace-plugin@1.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.SEMREL_TOKEN }} #
  update-semver:
    name: Move Respository semver tags
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: haya14busa/action-update-semver@v1
