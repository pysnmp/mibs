name: release-chart
on:
  push:
    tags: "v*"

jobs:
  release-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v7
      - name: Install Helm
        uses: azure/setup-helm@v5
      - name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package chart
        run: helm package charts/mibserver -d /tmp/chart
      - name: Publish Helm chart - OCI
        run: helm push /tmp/chart/*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
      - name: Verify OCI chart
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/verify
          helm pull oci://ghcr.io/${{ github.repository_owner }}/charts/mibserver \
            --version "$VERSION" -d /tmp/verify
          test -s /tmp/verify/mibserver-"$VERSION".tgz
      - name: Attach chart to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" /tmp/chart/*.tgz --clobber
      - name: Build legacy chart index
        run: |
          mkdir -p /tmp/index
          cp /tmp/chart/*.tgz /tmp/index/
          helm repo index /tmp/index \
            --url https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME \
            --merge charts/index.yaml
          rm -f /tmp/index/*.tgz
          PREV=$(grep -c 'releases/download' charts/index.yaml)
          NEW=$(grep -c 'releases/download' /tmp/index/index.yaml)
          test "$NEW" -gt "$PREV"
      - name: Commit legacy chart index to main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/index/index.yaml charts/index.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/index.yaml
          git commit -m "chore(charts): index $GITHUB_REF_NAME"
          git push origin main || (git pull --rebase origin main && git push origin main)
      - name: Publish legacy chart index - gh-pages (deprecated)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/index
          destination_dir: charts
          keep_files: false
