name: cd-pages-helm

on:
  push:
    branches-ignore:
      - "**"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  image:
    name: Release
    if: github.repository == 'splunk/mibs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y parallel
          pipx install --python python3.11 poetry==2.1.2
          poetry install
      - name: Build and index MIBs
        run: MIB_SOURCE_URL="file://$PWD/src" poetry run make index
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mibserver-build-logs
          path: log/
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Packages Docker Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/splunk/mibs/container
          tags: |
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=sha,format=long
      - name: Build and push action
        id: docker_action_build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-to: type=inline
      - name: Deploy MIB files
        if: ${{ !contains(github.ref_name, '-') }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_TOKEN_ADMIN }}
          publish_dir: ./output
          keep_files: true

  helm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: image
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/package /tmp/index /tmp/origin
          VERSION="$GITHUB_REF_NAME"
          wget -q https://splunk.github.io/mibs/charts/index.yaml -P /tmp/origin || true
          helm package charts/mibserver -d /tmp/package
          gh release upload "$VERSION" /tmp/package/*
          helm repo index /tmp/package --url "https://github.com/splunk/mibs/releases/download/$VERSION" --merge /tmp/origin/index.yaml
          cp /tmp/package/index.yaml /tmp/index/
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_TOKEN_ADMIN }}
          publish_dir: /tmp/index
          destination_dir: charts
          keep_files: true
